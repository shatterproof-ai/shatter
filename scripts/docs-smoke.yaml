# Configuration for the docs examples smoke gate (scripts/docs-smoke.py,
# str-u394l.2). See CONTRIBUTING.md "Documentation examples smoke gate".
#
# `docs`: user-facing documents whose fenced examples are validated. Shell
# (```bash/sh/shell/console) `shatter` invocations are checked against the
# built CLI; ```json / ```yaml blocks are parsed for syntax. Illustrative
# blocks are exempted inline with a directive on the line above the fence:
#
#     <!-- docs-smoke: skip reason="why this block is not checkable" -->
#
# `smoke_commands`: self-contained commands executed in a throwaway temp dir to
# prove the command surface is live. Keep these fast and side-effect-free (no
# network, no project mutation) — they should be safe to run anywhere.
# `{repo_root}` is substituted with the repository root; `{fixtures}` is
# substituted with a *copy* of scripts/docs-smoke-fixtures/ made inside the
# throwaway directory for the duration of the run, so a command exercising a
# real target (which writes artifacts next to the target file, not under cwd)
# does not leave stray output in the checkout.

docs:
  - README.md
  - QUICKSTART.md
  - SPEC.md
  - docs/INDEX.md

smoke_commands:
  - shatter --version
  - shatter --help
  - shatter explore --help
  - shatter scan --help
  - shatter list-targets --help
  # Real end-to-end execution (str-qwua7.9): proves the documented
  # `shatter explore` invocation shape actually runs against a real target,
  # not just that its flags exist. Uses --allow-host-writes because target
  # execution is default-deny without an OS sandbox backend configured (see
  # shatter-cli/src/host_writes.rs) — this is the same opt-in QUICKSTART's
  # first example must document. The fixture mirrors QUICKSTART's own
  # example function so this exercises the same shape a new user would run.
  - shatter explore --allow-host-writes {fixtures}/shipping.ts:calculateShipping
