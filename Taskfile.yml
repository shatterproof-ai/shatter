version: '3'

# Per-agent parallelism budgets (str-35vtk.5). Many agents share this
# machine; each tool would otherwise assume it owns every core. A pre-set
# environment value wins (solo humans / CI reclaim full parallelism by
# exporting GOFLAGS / GOMAXPROCS; cargo caps live in .cargo/config.toml and
# yield to CARGO_BUILD_JOBS / RUST_TEST_THREADS).
env:
  GOFLAGS: '{{env "GOFLAGS" | default "-p=4"}}'
  GOMAXPROCS: '{{env "GOMAXPROCS" | default "8"}}'

includes:
  core:
    taskfile: ./shatter-core/Taskfile.yml
    dir: ./shatter-core
  cli:
    taskfile: ./shatter-cli/Taskfile.yml
    dir: ./shatter-cli
  ts:
    taskfile: ./shatter-ts/Taskfile.yml
    dir: ./shatter-ts
  go:
    taskfile: ./shatter-go/Taskfile.yml
    dir: ./shatter-go
  rust-fe:
    taskfile: ./shatter-rust/Taskfile.yml
    dir: ./shatter-rust
  rust-rt:
    taskfile: ./shatter-rust-runtime/Taskfile.yml
    dir: ./shatter-rust-runtime

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # --- Build (issue 2/4) ---

  build:
    desc: Build everything (Rust + TS + Go)
    deps: [workspace-build, ts:build, go:build, rust-fe:build, rust-rt:build]

  build-rust:
    desc: Build all Rust crates
    deps: [workspace-build, rust-fe:build, rust-rt:build]

  workspace-build:
    internal: true
    sources:
      - Cargo.toml
      - Cargo.lock
      - shatter-core/Cargo.toml
      - shatter-core/build.rs
      - shatter-core/**/*.rs
      - shatter-cli/Cargo.toml
      - shatter-cli/build.rs
      - shatter-cli/**/*.rs
      - shatter-llm/Cargo.toml
      - shatter-llm/**/*.rs
    cmds:
      - cargo build --workspace

  build-examples:
    desc: Build example targets
    sources:
      - scripts/examples_checkout.py
    # The shared examples checkout is treated as read-only (str-35vtk.4): a
    # concurrent refresh may reset/clean it at any time, so cargo's build
    # output must not live inside it. Redirect target/ outside the checkout
    # rather than the default in-tree location.
    env:
      CARGO_TARGET_DIR: '{{env "CARGO_TARGET_DIR" | default (printf "%s/target/examples-build" .ROOT_DIR)}}'
    cmds:
      - |
        examples_root="$(python3 scripts/examples_checkout.py)"
        cargo build --manifest-path "$examples_root/rust/Cargo.toml"
      - |
        examples_root="$(python3 scripts/examples_checkout.py --no-update)"
        cargo build --manifest-path "$examples_root/generators/wasm-rust/Cargo.toml"
      - |
        examples_root="$(python3 scripts/examples_checkout.py --no-update)"
        cargo build --manifest-path "$examples_root/generators/wasm-adversarial/Cargo.toml"

  # --- Test aggregation (issue 4) ---

  test:
    desc: Run all tests (all languages)
    # The root workspace test starts only after the frontends are built, so
    # core integration tests can use their prebuilt binaries.
    deps: [frontends-built, ts:test, go:test, rust-fe:test, rust-rt:test]
    cmds:
      - task: workspace-test

  test-quick:
    desc: "Quick: cargo workspace tests only"
    # Keep the frontend-build ordering used by the regular workspace test;
    # this is the development tier documented in CLAUDE.md.
    deps: [frontends-built]
    cmds:
      - task: workspace-test-quick

  test-standard:
    desc: "Standard: cargo tests + clippy"
    # The 26 subprocess TypeScript E2E tests are intentionally excluded here
    # and restored by core:test-ignored in the Full gate. Keep frontend build
    # ordering for the remaining workspace integration tests; the Rust and Go
    # frontend E2E suites remain in this Standard workspace tier.
    deps: [frontends-built, workspace-clippy]
    cmds:
      - task: workspace-test

  # Keep this body in sync with workspace-test-quick; the wiring regression
  # test enforces parity while their separate IDs protect Task's cache.
  workspace-test:
    internal: true
    sources:
      - Cargo.toml
      - Cargo.lock
      - shatter-core/Cargo.toml
      - shatter-core/build.rs
      - shatter-core/**/*.rs
      - shatter-cli/Cargo.toml
      - shatter-cli/build.rs
      - shatter-cli/**/*.rs
      - shatter-llm/Cargo.toml
      - shatter-llm/**/*.rs
      - scripts/examples_checkout.py
    cmds:
      - |
        examples_root="$(python3 scripts/examples_checkout.py)"
        export SHATTER_EXAMPLES_DIR="$examples_root"
        export SHATTER_GO_FRONTEND_BIN="$PWD/shatter-go/bin/shatter-go"
        cargo test --workspace

  # Keep this body in sync with workspace-test above. Its distinct checksum
  # identity protects the reduced property/fuzz budget.
  # Task does not fingerprint caller-provided environment variables, so using
  # workspace-test here could let a quick result satisfy test-standard later.
  workspace-test-quick:
    internal: true
    env:
      PROPTEST_CASES: '32'
      SHATTER_FUZZ_CASES: '32'
    sources:
      - Cargo.toml
      - Cargo.lock
      - shatter-core/Cargo.toml
      - shatter-core/build.rs
      - shatter-core/**/*.rs
      - shatter-cli/Cargo.toml
      - shatter-cli/build.rs
      - shatter-cli/**/*.rs
      - shatter-llm/Cargo.toml
      - shatter-llm/**/*.rs
      - scripts/examples_checkout.py
    cmds:
      - |
        examples_root="$(python3 scripts/examples_checkout.py)"
        export SHATTER_EXAMPLES_DIR="$examples_root"
        export SHATTER_GO_FRONTEND_BIN="$PWD/shatter-go/bin/shatter-go"
        cargo test --workspace

  workspace-clippy:
    internal: true
    sources:
      - Cargo.toml
      - Cargo.lock
      - shatter-core/Cargo.toml
      - shatter-core/build.rs
      - shatter-core/**/*.rs
      - shatter-cli/Cargo.toml
      - shatter-cli/build.rs
      - shatter-cli/**/*.rs
      - shatter-llm/Cargo.toml
      - shatter-llm/**/*.rs
    cmds:
      - cargo clippy --workspace -- -D warnings

  frontends-built:
    internal: true
    deps: [ts:build, go:build, rust-fe:build]

  lint:
    desc: Run all linters
    deps: [workspace-clippy, rust-fe:clippy, rust-rt:clippy, go:vet]

  check-fast:
    desc: "Fast quality gate (pre-push: clippy + tests + TS + Go; nested-build suites serialized)"
    cmds:
      - bash scripts/gate-wrapper.sh check-fast task check-fast-governed

  check-fast-governed:
    deps: [core:clippy, cli:clippy, ts:test-fast, go:test-short]
    env:
      PROPTEST_CASES: '32'
      SHATTER_FUZZ_CASES: '32'
    cmds:
      # Same starvation hazard as check-unit: cli:test and core:test-ignored
      # spawn cargo/go builds from inside tests; run them after the parallel
      # deps, one at a time, inside one heavyweight slot.
      - task: cli:test-fast
      - task: core:test-ignored-fast

  # --- Cross-cutting quality (issue 5) ---

  schemas:
    desc: Validate protocol schemas against fixtures
    preconditions:
      - sh: command -v python3
        msg: "python3 not installed — skipping schema validation"
      - sh: python3 -c "import jsonschema" 2>/dev/null
        msg: "jsonschema not installed (pip install jsonschema)"
    sources:
      - protocol/schemas/**/*.json
      - protocol/schemas/**/*.py
      - protocol/fixtures/**/*.json
      - protocol/registry.yaml
    cmds:
      - python3 protocol/schemas/test_schema_validation.py

  # `parity` is defined once, below. go-task silently uses the LAST definition
  # of a duplicated task name — don't add another `parity:` here.

  conformance:
    desc: Run protocol conformance tests across all frontends
    preconditions:
      - sh: command -v python3
        msg: "python3 not installed"
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "pyyaml not installed (pip install pyyaml)"
    sources:
      - protocol/**/*
      - shatter-ts/src/**/*.ts
      - shatter-go/**/*.go
      - shatter-rust/src/**/*.rs
    cmds:
      - bash scripts/gate-wrapper.sh conformance task conformance-governed

  conformance-governed:
    deps: [ts:build, go:build, rust-fe:build]
    cmds:
      - python3 protocol/conformance/conformance_harness.py

  parity:
    desc: Validate frontend feature parity (registry consistency + capability contract)
    preconditions:
      - sh: command -v python3
        msg: "python3 not installed"
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "pyyaml not installed (pip install pyyaml)"
    sources:
      - protocol/registry.yaml
      - protocol/conformance/golden_cases.yaml
      - protocol/conformance/golden/**/*
      - protocol/generated/manifest.json
      - scripts/validate-protocol-registry.py
      - scripts/protocol-codegen.py
      - shatter-ts/src/**/*.ts
      - shatter-go/**/*.go
      - shatter-rust/src/**/*.rs
    cmds:
      - bash scripts/gate-wrapper.sh parity task parity-governed

  parity-governed:
    deps: [ts:build, go:build, rust-fe:build]
    cmds:
      - python3 scripts/validate-protocol-registry.py
      - python3 scripts/protocol-codegen.py --check
      - |
        if [ -f scripts/validate-parity.py ]; then
          python3 scripts/validate-parity.py
        else
          echo "[skip] validate-parity.py not present (pending str-7jgm.2)"
        fi
      - python3 protocol/conformance/run_golden_tests.py

  drift-patrol:
    desc: "Bounded drift patrol (protocol registry/codegen, conformance, parity expiry, tracker hygiene). See docs/DRIFT-PATROL.md."
    # Build the frontends first so the conformance check runs for real instead
    # of degrading to a hollow pass — that is why --require-conformance is safe
    # here but not for a bare `python3 scripts/drift-patrol.py`.
    # No `sources:` (unlike parity/golden-test/docs-smoke): staleness here is
    # date-driven (stale tracker issues, parity expiry windows), not
    # file-content-driven, so a checksum-based skip-if-unchanged would be
    # wrong -- the same tree can go from clean to stale with no diff.
    deps: [ts:build, go:build, rust-fe:build]
    preconditions:
      - sh: command -v python3
        msg: "python3 not installed"
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "pyyaml not installed (pip install pyyaml)"
    cmds:
      - python3 scripts/drift-patrol.py --require-conformance

  protocol-codegen-check:
    desc: "Verify generated protocol artifacts are in sync with protocol/registry.yaml"
    preconditions:
      - sh: command -v python3
        msg: "python3 not installed"
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "pyyaml not installed (pip install pyyaml)"
    sources:
      - protocol/registry.yaml
      - protocol/generated/manifest.json
      - scripts/protocol-codegen.py
      - scripts/test_protocol_codegen.py
    cmds:
      - python3 scripts/protocol-codegen.py --check
      - python3 -m unittest scripts.test_protocol_codegen

  golden-test:
    desc: Run cross-frontend parity golden tests (compare capabilities and outputs against recorded expectations)
    preconditions:
      - sh: command -v python3
        msg: "python3 not installed"
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "pyyaml not installed (pip install pyyaml)"
    sources:
      - protocol/conformance/golden_cases.yaml
      - protocol/conformance/golden/**/*
      - protocol/registry.yaml
      - shatter-ts/src/**/*.ts
      - shatter-go/**/*.go
      - shatter-rust/src/**/*.rs
    cmds:
      - bash scripts/gate-wrapper.sh golden task golden-test-governed

  golden-test-governed:
    deps: [ts:build, go:build, rust-fe:build]
    cmds:
      - python3 protocol/conformance/run_golden_tests.py

  docs-smoke:
    desc: "Validate docs examples against the built CLI (stale flags, removed commands, invalid JSON/YAML)"
    deps: [cli:build]
    preconditions:
      - sh: command -v python3
        msg: "python3 not installed"
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "pyyaml not installed (pip install pyyaml)"
    sources:
      - scripts/docs-smoke.py
      - scripts/docs-smoke.yaml
      - README.md
      - QUICKSTART.md
      - SPEC.md
      - docs/INDEX.md
    cmds:
      - python3 scripts/docs-smoke.py

  docs:
    desc: Run documentation quality checks
    sources:
      - "*.md"
      - docs/**/*
    cmds:
      - |
        test -f README.md || { echo "missing README.md"; exit 1; }
        test -f AGENTS.md || { echo "missing AGENTS.md"; exit 1; }
        test -f CLAUDE.md || { echo "missing CLAUDE.md"; exit 1; }
        test -d docs || { echo "missing docs/"; exit 1; }
        echo "[ok] core documentation files present"
      - |
        if command -v markdownlint-cli2 >/dev/null 2>&1; then
          markdownlint-cli2 --config .markdownlint-cli2.yaml \
            README.md AGENTS.md CLAUDE.md PLAN.md SPEC.md PROTOCOL.md PARITY.md docs
        else echo "[skip] markdownlint-cli2 not installed"; fi
      - |
        if command -v vale >/dev/null 2>&1; then
          vale README.md AGENTS.md CLAUDE.md PLAN.md SPEC.md PROTOCOL.md PARITY.md docs
        else echo "[skip] vale not installed"; fi
      - |
        if command -v lychee >/dev/null 2>&1; then
          lychee --config lychee.toml --no-progress \
            README.md AGENTS.md CLAUDE.md PLAN.md SPEC.md PROTOCOL.md PARITY.md docs
        else echo "[skip] lychee not installed"; fi

  cache-helper-tests:
    desc: Test compilation-cache worktree and storage helpers
    sources:
      - scripts/seed-worktree.sh
      - scripts/test_seed_worktree.sh
      - scripts/target-dir-report.sh
      - scripts/test_target_dir_report.sh
      - scripts/test_target_dir_report_json.sh
    cmds:
      - bash scripts/test_seed_worktree.sh
      - bash scripts/test_target_dir_report.sh
      - bash scripts/test_target_dir_report_json.sh

  meta:
    desc: Run repository meta checks (workflow lint, Semgrep)
    sources:
      - Taskfile.yml
      - .config/nextest.toml
      - .config/nextest-standalone.toml
      - .github/workflows/**/*.yml
      - .semgrep/**/*
      - install.sh
      - scripts/test_release_workflow.py
      - scripts/test_install_manifest.py
      - scripts/package_npm_release.py
      - scripts/test_package_npm_release.py
      - scripts/retention_continuous_releases.py
      - scripts/test_retention_continuous_releases.py
      - scripts/drift-patrol.py
      - scripts/test_drift_patrol.py
      - scripts/cleanup-merged-remote-branches.sh
      - scripts/test_cleanup_merged_remote_branches.sh
      - scripts/examples_checkout.py
      - scripts/test_walkthrough_examples_checkout.py
      - scripts/setup-hooks.sh
      - scripts/test_setup_hooks.sh
      - demo/walkthrough.sh
      - demo/gauntlet.sh
      - scripts/test_demo_cache_modes.sh
      - scripts/test_root_cargo_phases.py
      - scripts/test_governed_task_graph.py
      - scripts/go-test-tier.sh
      - scripts/test_test_tier_wiring.py
      - shatter-cli/Taskfile.yml
      - shatter-core/Taskfile.yml
      - shatter-core/tests/**/*.rs
      - shatter-go/Taskfile.yml
      - shatter-rust/Taskfile.yml
      - shatter-rust-runtime/Taskfile.yml
      - shatter-ts/Taskfile.yml
      - shatter-ts/jest.config.js
      - shatter-ts/src/**/*.ts
    cmds:
      - bash -n install.sh
      - python3 -m unittest scripts.test_drift_patrol
      - python3 -m unittest scripts.test_release_workflow
      - python3 -m unittest scripts.test_install_manifest
      - python3 -m unittest scripts.test_package_npm_release
      - python3 -m unittest scripts.test_retention_continuous_releases
      - bash scripts/test_cleanup_merged_remote_branches.sh
      - python3 -m unittest scripts.test_walkthrough_examples_checkout
      - bash scripts/test_setup_hooks.sh
      - bash scripts/test_demo_cache_modes.sh
      - python3 -m unittest scripts.test_root_cargo_phases
      - python3 -m unittest scripts.test_governed_task_graph
      - python3 -m unittest scripts.test_test_tier_wiring
      - cd shatter-go-tool && go test ./...
      - |
        if [ -d .github/workflows ] && command -v actionlint >/dev/null 2>&1; then
          actionlint
        else echo "[skip] actionlint not installed or no workflows"; fi
      - |
        cfg="${SEMGREP_CONFIG:-.semgrep/shatter.yml}"
        if [ -f "$cfg" ] && command -v semgrep >/dev/null 2>&1; then
          semgrep --config "$cfg" .
        else echo "[skip] semgrep not installed or no config"; fi

  tooling:
    desc: Report available required and optional tools
    cmds:
      - |
        echo "==> Required"
        for t in git cargo node npm go; do
          command -v "$t" >/dev/null && echo "  [ok] $t" || { echo "  [MISSING] $t"; exit 1; }
        done
        echo "==> Optional"
        for t in bd semgrep pre-commit reviewdog actionlint lychee vale markdownlint-cli2 golangci-lint staticcheck govulncheck cargo-nextest cargo-deny cargo-udeps; do
          command -v "$t" >/dev/null && echo "  [ok] $t" || echo "  [--] $t"
        done

  check:
    desc: "Full quality suite (staged fail-fast: static -> unit -> integration; one heavyweight slot machine-wide)"
    cmds:
      - bash scripts/gate-wrapper.sh check task check-governed

  check-governed:
    env:
      PROPTEST_CASES: '256'
      SHATTER_FUZZ_CASES: '1000'
      SHATTER_FAST_CHECK_NUM_RUNS: default
    cmds:
      # One wrapper = one machine-wide heavyweight slot for the whole check;
      # nested wrapped tasks pass through via SHATTER_GATE_LOCK_HELD.
      # Nested task calls do not propagate `task --force check` into the
      # stages; force a stage directly (e.g. `task --force check-unit`) when
      # you need a re-run.
      - task: check-static
      - task: check-unit
      - task: check-integration

  check-static:
    desc: "check stage 1: cheap checks — clippy, schemas, docs lint, meta (meta includes small go/python test runs)"
    deps:
      - core:clippy
      - cli:clippy
      - rust-fe:clippy
      - rust-rt:clippy
      - schemas
      - docs
      - docs-smoke
      - cache-helper-tests
      - meta

  check-unit:
    desc: "check stage 2: unit test suites (nested-build suites serialized last)"
    deps:
      - rust-rt:test
      - ts:test
      - go:test
      - go:vet
    cmds:
      # cli:test and rust-fe:test both spawn nested cargo builds from inside
      # tests (scan pipelines / fixture-crate harnesses). If run in parallel
      # with each other and the deps above, they starve those builds past
      # their 60s deadlines ("build timed out" flakes). Keep them sequenced
      # here, not as parallel deps.
      - task: cli:test
      - task: rust-fe:test

  check-integration:
    desc: "check stage 3: expensive integration (core e2e superset, conformance, parity). Core unit-test failures surface here, not stage 2: they ride in core:test-ignored to avoid running the core suite twice per check; stage-1 clippy already catches compile-level core breaks."
    deps:
      - go:build
    cmds:
      - task: core:test-ignored
      # Keep the public spellings: their nested wrappers pass through the
      # existing lease, while their source caches can still skip unchanged work.
      - task: conformance
      - task: parity

  # --- E2E, pre-completion, gauntlet, clean (issue 6) ---

  e2e:
    desc: Run E2E concolic pipeline tests (TS + Rust + Go frontends)
    cmds:
      - bash scripts/gate-wrapper.sh e2e task e2e-governed

  e2e-governed:
    # Build all three frontends in parallel up front; the subtasks' own dep
    # checks then no-op and the test phases run sequentially.
    deps: [ts:build, go:build, rust-fe:build]
    cmds:
      - task: e2e-ts
      - task: e2e-go
      - task: e2e-rust

  e2e-ts:
    desc: "E2E concolic pipeline: TypeScript frontend (e2e_concolic.rs; also uses the prebuilt Go frontend for its Go planner section)"
    sources:
      - shatter-core/tests/e2e_concolic.rs
      - shatter-core/src/**/*.rs
      - shatter-ts/src/**/*.ts
      - shatter-go/**/*.go
      - scripts/examples_checkout.py
    cmds:
      - bash scripts/gate-wrapper.sh e2e-ts task e2e-ts-governed

  e2e-ts-governed:
    deps: [ts:build, go:build]
    cmds:
      - |
        examples_root="$(python3 scripts/examples_checkout.py)"
        export SHATTER_EXAMPLES_DIR="$examples_root"
        export SHATTER_GO_FRONTEND_BIN="$PWD/shatter-go/bin/shatter-go"
        cargo test --test e2e_concolic -- --include-ignored

  e2e-go:
    desc: "E2E concolic pipeline: Go frontend (e2e_concolic_go.rs)"
    sources:
      - shatter-core/tests/e2e_concolic_go.rs
      - shatter-core/src/**/*.rs
      - shatter-go/**/*.go
      - scripts/examples_checkout.py
    cmds:
      - bash scripts/gate-wrapper.sh e2e-go task e2e-go-governed

  e2e-go-governed:
    deps: [go:build]
    cmds:
      - |
        examples_root="$(python3 scripts/examples_checkout.py --no-update)"
        export SHATTER_EXAMPLES_DIR="$examples_root"
        export SHATTER_GO_FRONTEND_BIN="$PWD/shatter-go/bin/shatter-go"
        cargo test --test e2e_concolic_go -- --include-ignored

  e2e-rust:
    desc: "E2E concolic pipeline: Rust frontend (e2e_concolic_rust.rs)"
    sources:
      - shatter-core/tests/e2e_concolic_rust.rs
      - shatter-core/src/**/*.rs
      - shatter-rust/src/**/*.rs
      - scripts/examples_checkout.py
    cmds:
      - bash scripts/gate-wrapper.sh e2e-rust task e2e-rust-governed

  e2e-rust-governed:
    deps: [rust-fe:build]
    cmds:
      - |
        examples_root="$(python3 scripts/examples_checkout.py --no-update)"
        export SHATTER_EXAMPLES_DIR="$examples_root"
        cargo test --test e2e_concolic_rust -- --include-ignored

  smoke:
    desc: "Fast pipeline smoke check (~15s). Covers: TS function, Go standalone with func main(), Go library function, failed-instrumentation regression."
    deps: [ts:build]
    # str-gg9v: these steps execute target functions without an OS sandbox, so
    # opt into host execution (targets still run in a throwaway working dir).
    env:
      SHATTER_ALLOW_HOST_WRITES: "1"
    cmds:
      - |
        examples_root="$(python3 scripts/examples_checkout.py)"
        cargo run -p shatter-cli -- explore --max-iterations 3 --timeout-explore 10 "$examples_root/standalone/ts/01-arithmetic.ts:classifyNumber"
      - |
        examples_root="$(python3 scripts/examples_checkout.py --no-update)"
        cargo run -p shatter-cli -- explore --max-iterations 3 --timeout-explore 10 "$examples_root/standalone/go/smoke-main.go:SmokeClassify"
      - |
        examples_root="$(python3 scripts/examples_checkout.py --no-update)"
        cargo run -p shatter-cli -- explore --max-iterations 3 --timeout-explore 10 "$examples_root/standalone/go/01-arithmetic.go:ClassifyNumber"
      - bash scripts/test_empty_report_regression.sh

  pre-completion:
    desc: Pre-completion quality gate (smoke + full check + git status)
    cmds:
      - task: smoke
      - task: check
      - git status --short

  pre-completion-e2e:
    desc: Pre-completion with E2E tests
    cmds:
      - task: check
      - task: e2e
      - git status --short

  walkthrough:
    desc: Run the compact walkthrough demo with reusable per-user caches
    cmds:
      - bash scripts/gate-wrapper.sh walkthrough task walkthrough-governed

  walkthrough-governed:
    deps: [build]
    # str-gg9v: demo/walkthrough.sh self-exports SHATTER_ALLOW_HOST_WRITES.
    cmds:
      - bash demo/walkthrough.sh --auto --delay 0

  walkthrough-cold:
    desc: Run the compact walkthrough with isolated disposable caches (release validation)
    cmds:
      - bash scripts/gate-wrapper.sh walkthrough-cold task walkthrough-cold-governed

  walkthrough-cold-governed:
    deps: [build]
    cmds:
      - bash demo/walkthrough.sh --cold --auto --delay 0

  gauntlet:
    desc: Run the broad CLI coverage gauntlet with reusable per-user caches
    cmds:
      - bash scripts/gate-wrapper.sh gauntlet task gauntlet-governed

  gauntlet-governed:
    deps: [build]
    # str-gg9v: demo/gauntlet.sh self-exports SHATTER_ALLOW_HOST_WRITES.
    cmds:
      - bash demo/gauntlet.sh --auto --delay 0

  gauntlet-cold:
    desc: Run the gauntlet with isolated disposable caches (hermetic/release validation)
    cmds:
      - bash scripts/gate-wrapper.sh gauntlet-cold task gauntlet-cold-governed

  gauntlet-cold-governed:
    deps: [build]
    cmds:
      - bash demo/gauntlet.sh --cold --auto --delay 0

  broad-run-corpus:
    desc: Run the broad-run validation corpus gate (Kapow failure-class fixtures)
    deps: [cli:build]
    # str-gg9v: scans execute target functions unsandboxed; opt in so the
    # default-deny guard permits execution (writes go to a throwaway working dir).
    env:
      SHATTER_ALLOW_HOST_WRITES: "1"
    preconditions:
      - sh: command -v python3 >/dev/null 2>&1
        msg: "python3 not installed"
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "pyyaml not installed (pip install pyyaml)"
    sources:
      - tests/fixtures/broad-run-corpus/**/*
      - tests/scripts/broad_run_validation.py
    cmds:
      - python3 tests/scripts/broad_run_validation.py

  perf-list:
    desc: List external profiling scenarios
    preconditions:
      - sh: command -v python3 >/dev/null 2>&1
        msg: "python3 not installed"
    cmds:
      - python3 scripts/perf_runner.py list

  perf-scenario:
    desc: Run one named external profiling scenario (set SCENARIO=<id>)
    preconditions:
      - sh: test -n "{{.SCENARIO}}"
        msg: "set SCENARIO=<id>"
      - sh: test -n "{{.RESULTS_DIR}}"
        msg: "set RESULTS_DIR=<dir>"
      - sh: command -v python3 >/dev/null 2>&1
        msg: "python3 not installed"
    cmds:
      - python3 scripts/perf_runner.py run --scenario "{{.SCENARIO}}" --results-dir "{{.RESULTS_DIR}}"

  perf-baseline:
    desc: Run the full external profiling corpus
    preconditions:
      - sh: test -n "{{.RESULTS_DIR}}"
        msg: "set RESULTS_DIR=<dir>"
      - sh: command -v python3 >/dev/null 2>&1
        msg: "python3 not installed"
    cmds:
      - python3 scripts/perf_runner.py run --all --results-dir "{{.RESULTS_DIR}}"

  perf-stat-scenario:
    desc: Run one scenario under perf stat (set SCENARIO=<id>)
    preconditions:
      - sh: test -n "{{.SCENARIO}}"
        msg: "set SCENARIO=<id>"
      - sh: test -n "{{.RESULTS_DIR}}"
        msg: "set RESULTS_DIR=<dir>"
      - sh: command -v python3 >/dev/null 2>&1
        msg: "python3 not installed"
      - sh: command -v perf >/dev/null 2>&1
        msg: "perf not installed"
    cmds:
      - python3 scripts/perf_runner.py run --scenario "{{.SCENARIO}}" --profiler perf-stat --results-dir "{{.RESULTS_DIR}}"

  perf-record-scenario:
    desc: Run one scenario under perf record (set SCENARIO=<id>)
    preconditions:
      - sh: test -n "{{.SCENARIO}}"
        msg: "set SCENARIO=<id>"
      - sh: test -n "{{.RESULTS_DIR}}"
        msg: "set RESULTS_DIR=<dir>"
      - sh: command -v python3 >/dev/null 2>&1
        msg: "python3 not installed"
      - sh: command -v perf >/dev/null 2>&1
        msg: "perf not installed"
    cmds:
      - python3 scripts/perf_runner.py run --scenario "{{.SCENARIO}}" --profiler perf-record --results-dir "{{.RESULTS_DIR}}"

  pprof-scenario:
    desc: Run one Go-focused scenario with pprof (set SCENARIO=<id>)
    preconditions:
      - sh: test -n "{{.SCENARIO}}"
        msg: "set SCENARIO=<id>"
      - sh: test -n "{{.RESULTS_DIR}}"
        msg: "set RESULTS_DIR=<dir>"
      - sh: command -v python3 >/dev/null 2>&1
        msg: "python3 not installed"
      - sh: command -v go >/dev/null 2>&1
        msg: "go not installed"
    cmds:
      - python3 scripts/perf_runner.py run --scenario "{{.SCENARIO}}" --profiler pprof --results-dir "{{.RESULTS_DIR}}"

  perf-report:
    desc: Generate markdown and JSON summaries from perf artifacts
    preconditions:
      - sh: test -n "{{.RESULTS_DIR}}"
        msg: "set RESULTS_DIR=<dir>"
      - sh: command -v python3 >/dev/null 2>&1
        msg: "python3 not installed"
    cmds:
      - python3 scripts/perf_report.py --results-dir "{{.RESULTS_DIR}}"

  perf-compare:
    desc: Compare two perf result directories (set BASELINE_DIR and CANDIDATE_DIR)
    preconditions:
      - sh: test -n "{{.BASELINE_DIR}}"
        msg: "set BASELINE_DIR=<dir>"
      - sh: test -n "{{.CANDIDATE_DIR}}"
        msg: "set CANDIDATE_DIR=<dir>"
      - sh: command -v python3 >/dev/null 2>&1
        msg: "python3 not installed"
    cmds:
      - python3 scripts/perf_compare.py --baseline-dir "{{.BASELINE_DIR}}" --candidate-dir "{{.CANDIDATE_DIR}}"

  perf-ci:
    desc: Run the stable weekly profiling subset and refresh the latest summary
    preconditions:
      - sh: test -n "{{.RESULTS_DIR}}"
        msg: "set RESULTS_DIR=<dir>"
      - sh: command -v python3 >/dev/null 2>&1
        msg: "python3 not installed"
    cmds:
      - python3 scripts/perf_runner.py run --scenario-file perf/stable-scenarios.txt --results-dir "{{.RESULTS_DIR}}"
      - python3 scripts/perf_report.py --results-dir "{{.RESULTS_DIR}}"

  perf-isolation:
    desc: Run the isolation mode corpus (set RESULTS_DIR, default .shatter-cache/perf-runs/isolation)
    vars:
      RESULTS_DIR: '{{.RESULTS_DIR | default ".shatter-cache/perf-runs/isolation"}}'
    preconditions:
      - sh: command -v python3 >/dev/null 2>&1
        msg: "python3 not installed"
    cmds:
      - python3 scripts/perf_runner.py run --filter 'isolation-' --results-dir "{{.RESULTS_DIR}}"

  perf-isolation-report:
    desc: Generate cross-mode isolation comparison report (set RESULTS_DIR, default .shatter-cache/perf-runs/isolation)
    vars:
      RESULTS_DIR: '{{.RESULTS_DIR | default ".shatter-cache/perf-runs/isolation"}}'
    preconditions:
      - sh: command -v python3 >/dev/null 2>&1
        msg: "python3 not installed"
    cmds:
      - python3 scripts/perf_isolation_report.py --results-dir "{{.RESULTS_DIR}}" --markdown-out "{{.RESULTS_DIR}}/isolation-report.md" --json-out "{{.RESULTS_DIR}}/isolation-report.json"

  broad-run-validation:
    desc: "Broad-run validation corpus gate (str-jeen.14). Documented local check; not in CI."
    deps: [cli:build, ts:build, go:build]
    # str-gg9v: scans execute target functions unsandboxed; opt in so the
    # default-deny guard permits execution (writes go to a throwaway working dir).
    env:
      SHATTER_ALLOW_HOST_WRITES: "1"
    preconditions:
      - sh: command -v python3 >/dev/null 2>&1
        msg: "python3 not installed"
      - sh: python3 -c "import yaml" 2>/dev/null
        msg: "pyyaml not installed (pip install pyyaml)"
    sources:
      - tests/broad-run-corpus/**/*
      - scripts/broad_run_validation_gate.py
      - examples/go/internal-method/**/*
      - examples/go/mixed-package/**/*
      - examples/go/multi-import-wrapper/**/*
      - examples/go/rewrite-syntax/**/*
    cmds:
      - python3 scripts/broad_run_validation_gate.py --corpus tests/broad-run-corpus/manifest.yaml -v

  broad-run-validation-tests:
    desc: "Unit + property tests for the broad-run validation gate"
    cmds:
      - python3 -m unittest scripts.test_broad_run_validation_gate

  kapow-refute-agent:
    desc: "Check the Refute binary available to agents validating Kapow"
    cmds:
      - python3 scripts/kapow_refute_agent.py smoke

  kapow-refute-agent-tests:
    desc: "Unit tests for the Kapow Refute agent wrapper"
    cmds:
      - python3 -m unittest scripts.test_kapow_refute_agent

  build-doctor:
    desc: "Diagnose build acceleration (sccache wrapper + linker) configuration"
    cmds:
      - python3 scripts/build-cache-doctor.py

  clean:
    desc: Remove all build artifacts and checksum cache
    cmds:
      - cargo clean
      - rm -rf shatter-ts/dist shatter-ts/node_modules
      - cd shatter-go && go clean ./...
      - rm -rf .task/
