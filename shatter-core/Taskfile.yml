version: '3'

tasks:
  build:
    desc: Build shatter-core library
    sources:
      - src/**/*.rs
      - Cargo.toml
      - ../Cargo.lock
      - build.rs
    cmds:
      - cargo build -p shatter-core

  test:
    desc: Run shatter-core tests
    sources:
      - src/**/*.rs
      - tests/**/*.rs
      - Cargo.toml
      - ../Cargo.lock
      - build.rs
      - ../scripts/examples_checkout.py
      - ../.config/nextest.toml
    cmds:
      - |
        examples_root="$(python3 ../scripts/examples_checkout.py)"
        export SHATTER_EXAMPLES_DIR="$examples_root"
        if command -v cargo-nextest >/dev/null 2>&1; then
          cargo test -p shatter-core --doc
          cargo nextest run -p shatter-core
        else
          cargo test -p shatter-core
        fi

  # Keep this body in sync with test-ignored-fast; the wiring regression test
  # normalizes their descriptions and gate labels, then enforces parity.
  test-ignored:
    desc: Run shatter-core tests including slow/ignored tests
    sources:
      - src/**/*.rs
      - tests/**/*.rs
      - Cargo.toml
      - ../Cargo.lock
      - build.rs
      - ../.config/nextest.toml
      # Ignored concolic E2E tests execute all three frontends. A frontend
      # change must invalidate this gate even when shatter-core is unchanged.
      - ../shatter-ts/src/**/*.ts
      - ../shatter-ts/package.json
      - ../shatter-ts/package-lock.json
      - ../shatter-go/**/*.go
      - ../shatter-go/go.mod
      - ../shatter-go/go.sum
      - ../shatter-rust/src/**/*.rs
      - ../shatter-rust/Cargo.toml
      - ../shatter-rust-runtime/src/**/*.rs
      - ../shatter-rust-runtime/Cargo.toml
      - ../scripts/examples_checkout.py
    cmds:
      - |
        examples_root="$(python3 ../scripts/examples_checkout.py)"
        # Reuse the prebuilt Go frontend when present (root check-integration
        # deps go:build); the e2e tests fall back to building it otherwise.
        if [ -x "$PWD/../shatter-go/bin/shatter-go" ]; then
          export SHATTER_GO_FRONTEND_BIN="$PWD/../shatter-go/bin/shatter-go"
        fi
        export SHATTER_EXAMPLES_DIR="$examples_root"
        # str-6nul9: bench_frontier_ranking is an #[ignore]'d benchmark meant
        # for standalone invocation (see its own doc comment), not gate
        # coverage -- it runs several deliberate ~8s wallclock phases per
        # seed across many seeds/fixtures/strategies and structurally takes
        # far longer than any reasonable per-test gate timeout, regardless
        # of machine load.
        if command -v cargo-nextest >/dev/null 2>&1; then
          cargo test -p shatter-core --doc
          bash ../scripts/gate-wrapper.sh core:test-ignored cargo nextest run -p shatter-core --run-ignored all -E 'not binary(bench_frontier_ranking)'
        else
          bash ../scripts/gate-wrapper.sh core:test-ignored cargo test -p shatter-core -- --include-ignored --skip bench_frontier_ranking
        fi

  # Keep this body in sync with test-ignored above. Its separate checksum
  # identity protects check-fast's reduced property/fuzz budget.
  # Task does not include caller-provided environment variables in its cache.
  test-ignored-fast:
    desc: Run shatter-core tests including ignored tests with the caller's fast budget
    sources:
      - src/**/*.rs
      - tests/**/*.rs
      - Cargo.toml
      - ../Cargo.lock
      - build.rs
      - ../.config/nextest.toml
      - ../shatter-ts/src/**/*.ts
      - ../shatter-ts/package.json
      - ../shatter-ts/package-lock.json
      - ../shatter-go/**/*.go
      - ../shatter-go/go.mod
      - ../shatter-go/go.sum
      - ../shatter-rust/src/**/*.rs
      - ../shatter-rust/Cargo.toml
      - ../shatter-rust-runtime/src/**/*.rs
      - ../shatter-rust-runtime/Cargo.toml
      - ../scripts/examples_checkout.py
    cmds:
      - |
        examples_root="$(python3 ../scripts/examples_checkout.py)"
        if [ -x "$PWD/../shatter-go/bin/shatter-go" ]; then
          export SHATTER_GO_FRONTEND_BIN="$PWD/../shatter-go/bin/shatter-go"
        fi
        export SHATTER_EXAMPLES_DIR="$examples_root"
        # str-6nul9: see the matching comment in test-ignored above.
        if command -v cargo-nextest >/dev/null 2>&1; then
          cargo test -p shatter-core --doc
          bash ../scripts/gate-wrapper.sh core:test-ignored-fast cargo nextest run -p shatter-core --run-ignored all -E 'not binary(bench_frontier_ranking)'
        else
          bash ../scripts/gate-wrapper.sh core:test-ignored-fast cargo test -p shatter-core -- --include-ignored --skip bench_frontier_ranking
        fi

  clippy:
    desc: Run clippy on shatter-core
    sources:
      - src/**/*.rs
      - Cargo.toml
      - ../Cargo.lock
      - build.rs
    cmds:
      - cargo clippy -p shatter-core -- -D warnings
