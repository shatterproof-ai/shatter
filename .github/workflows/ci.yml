name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # str-gg9v: CI runs unsandboxed, so opt into host execution for any step that
    # runs target functions (test-standard's CLI integration tests, etc.). Targets
    # still run in a throwaway working directory. The default-deny guard's refusal
    # behavior is covered independently by host_writes unit tests, which clear this
    # variable in-test, so setting it here does not mask a regression.
    env:
      SHATTER_ALLOW_HOST_WRITES: "1"
      # The repo .cargo/config.toml caps parallelism for the shared dev
      # machine (str-35vtk.5); CI runners own their cores, so size cargo to
      # the runner instead (env wins over the config file). The Go caps
      # (-p=4 / GOMAXPROCS=8) already fit a 4-core runner.
      CARGO_BUILD_JOBS: "4"
      PROPTEST_CASES: "256"
      SHATTER_FUZZ_CASES: "1000"
      SHATTER_FAST_CHECK_NUM_RUNS: default

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: shatter-ts/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: shatter-go/go.mod

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev z3

      - name: Install Python protocol tooling
        run: python3 -m pip install --user jsonschema pyyaml

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            shatter-rust/target
            shatter-rust-runtime/target
          key: ci-cargo-${{ hashFiles('Cargo.lock', 'shatter-rust/Cargo.lock', 'shatter-rust-runtime/Cargo.lock') }}
          restore-keys: |
            ci-cargo-

      # str-35vtk.21: `task check` (check-static -> check-unit ->
      # check-integration) is the full landing gate and already runs
      # test-standard, parity, and conformance as a superset. Invoking it
      # once here (instead of test-standard + parity + conformance as
      # separate steps) avoids redundant work without losing coverage; see
      # the str-35vtk.21 bd note for the suite-to-stage mapping.
      - name: Full landing gate (task check)
        run: task check

      # str-35vtk.21: task check's check-static/check-unit deps clippy and
      # test individual crates (core:clippy, cli:clippy, ...), not the
      # `workspace-clippy`/`workspace-test` Taskfile tasks that the removed
      # `task test-standard` step depended on -- so shatter-llm (a real
      # workspace member) is not covered by `task check` above. Cover it
      # explicitly here until it can be folded into check-static/check-unit's
      # deps in Taskfile.yml (tracked separately; see the str-35vtk.21 bd
      # note).
      - name: shatter-llm clippy
        run: cargo clippy -p shatter-llm -- -D warnings

      - name: shatter-llm tests
        run: cargo test -p shatter-llm

      # Mandatory on every host regardless of actionlint availability —
      # asserts this workflow's structural invariants (task check invoked
      # exactly once, no standalone parity/conformance steps) so a future
      # edit can't silently reintroduce a duplicate or redundant gate.
      - name: CI workflow structure regression test
        run: python3 scripts/test_ci_workflow_structure.py
