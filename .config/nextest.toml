# cargo-nextest configuration
# https://nexte.st/book/configuration

[profile.default]
# Local development: use all available threads, moderate timeout
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 2 }
fail-fast = true
status-level = "fail"
final-status-level = "slow"

[[profile.default.overrides]]
filter = 'binary(e2e_concolic_rust) | binary(rust_explore_integration) | binary(self_hosting_explore)'
test-group = "rust-frontend-harness"

[profile.ci]
# CI: stricter timeouts, retry flaky tests once
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 2 }
retries = 1
fail-fast = false
status-level = "fail"
final-status-level = "flaky"

[[profile.ci.overrides]]
filter = 'binary(e2e_concolic_rust) | binary(rust_explore_integration) | binary(self_hosting_explore)'
test-group = "rust-frontend-harness"

[test-groups.rust-frontend-harness]
# These binaries compile fixture crates into shared caches. Nextest runs each
# test in its own process, so their in-process mutexes cannot serialize builds.
max-threads = 1
