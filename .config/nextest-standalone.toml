# cargo-nextest configuration for standalone Rust workspaces.
#
# The root config also names root-only integration binaries, which nextest
# correctly rejects when it is loaded from shatter-rust or
# shatter-rust-runtime. Keep the shared resource/timeout policy here without
# those workspace-specific overrides.

[profile.default]
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 2 }
fail-fast = true
status-level = "fail"
final-status-level = "slow"

[profile.ci]
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 2 }
retries = 1
fail-fast = false
status-level = "fail"
final-status-level = "flaky"
