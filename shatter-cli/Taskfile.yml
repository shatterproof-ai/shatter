version: '3'

tasks:
  build:
    desc: Build shatter CLI binary
    sources:
      - src/**/*.rs
      - Cargo.toml
      - ../Cargo.lock
      - ../shatter-core/src/**/*.rs
      - ../shatter-core/Cargo.toml
      - ../shatter-core/build.rs
    cmds:
      - cargo build -p shatter-cli

  test:
    desc: Run shatter-cli tests
    sources:
      - src/**/*.rs
      - Cargo.toml
      - ../Cargo.lock
      - ../shatter-core/src/**/*.rs
      - ../shatter-core/Cargo.toml
      - ../.config/nextest.toml
    cmds:
      - |
        if command -v cargo-nextest >/dev/null 2>&1; then
          cargo nextest run -p shatter-cli
        else
          cargo test -p shatter-cli
        fi

  # Keep this body in sync with test above. Its distinct checksum identity
  # protects check-fast's reduced property-test budget.
  test-fast:
    desc: Run shatter-cli tests with the caller's fast budget
    sources:
      - src/**/*.rs
      - Cargo.toml
      - ../Cargo.lock
      - ../shatter-core/src/**/*.rs
      - ../shatter-core/Cargo.toml
      - ../.config/nextest.toml
    cmds:
      - |
        if command -v cargo-nextest >/dev/null 2>&1; then
          cargo nextest run -p shatter-cli
        else
          cargo test -p shatter-cli
        fi

  clippy:
    desc: Run clippy on shatter-cli
    sources:
      - src/**/*.rs
      - Cargo.toml
      - ../Cargo.lock
      - ../shatter-core/src/**/*.rs
      - ../shatter-core/Cargo.toml
    cmds:
      - cargo clippy -p shatter-cli -- -D warnings
