version: '3'

tasks:
  build:
    desc: Build shatter CLI binary
    sources:
      - src/**/*.rs
      - Cargo.toml
      - ../Cargo.lock
      - ../shatter-core/src/**/*.rs
      - ../shatter-core/Cargo.toml
      - ../shatter-core/build.rs
    cmds:
      - cargo build -p shatter-cli

  test:
    desc: Run shatter-cli tests
    sources:
      - src/**/*.rs
      - Cargo.toml
      - ../Cargo.lock
      - ../shatter-core/src/**/*.rs
      - ../shatter-core/Cargo.toml
      - ../.config/nextest.toml
    cmds:
      - |
        if command -v cargo-nextest >/dev/null 2>&1; then
          cargo nextest run -p shatter-cli
        else
          cargo test -p shatter-cli
        fi
      - task: guard-temp-root

  # Keep this body in sync with test above. Its distinct checksum identity
  # protects check-fast's reduced property-test budget.
  test-fast:
    desc: Run shatter-cli tests with the caller's fast budget
    sources:
      - src/**/*.rs
      - Cargo.toml
      - ../Cargo.lock
      - ../shatter-core/src/**/*.rs
      - ../shatter-core/Cargo.toml
      - ../.config/nextest.toml
    cmds:
      - |
        if command -v cargo-nextest >/dev/null 2>&1; then
          cargo nextest run -p shatter-cli
        else
          cargo test -p shatter-cli
        fi
      - task: guard-temp-root

  # A test that runs shatter with cwd == the temp root triggers implicit init and
  # leaves <tmp>/.shatter/config.yaml, which poisons every later test and session
  # (str-49drv.214). Fail loudly, naming the polluter's likely cause.
  guard-temp-root:
    internal: true
    cmds:
      - |
        stray="${TMPDIR:-/tmp}/.shatter"
        if [ -e "$stray" ]; then
          echo "ERROR: $stray exists after the shatter-cli suite: a test ran shatter with the temp root as cwd (implicit init). Remove it and fix the test (str-49drv.214)." >&2
          # Remove it so the leftover doesn't also fail every later, unrelated
          # run in this or any other worktree sharing the same temp root
          # (this project has hit that self-poisoning pattern before) --
          # this run still fails to surface the polluter.
          rm -rf "$stray"
          exit 1
        fi

  clippy:
    desc: Run clippy on shatter-cli
    sources:
      - src/**/*.rs
      - Cargo.toml
      - ../Cargo.lock
      - ../shatter-core/src/**/*.rs
      - ../shatter-core/Cargo.toml
    cmds:
      - cargo clippy -p shatter-cli -- -D warnings
